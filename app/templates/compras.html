{% extends "base.html" %}

{% block title %}Compras{% endblock %}

{% block content %}

<style>
.compras-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    align-items: start;
}

.card {
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.card h2,
.card h3 {
    margin-bottom: 14px;
    color: #1f2937;
}

.campo-label {
    display: block;
    margin: 10px 0 6px;
    font-weight: 600;
    color: #374151;
}

.campo {
    width: 100%;
    padding: 10px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
}

.btn {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
}

.btn-primario {
    background: #0ea5a8;
    color: white;
}

.btn-secundario {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
}

.btn-danger {
    background: white;
    color: #b42318;
    border: 1px solid #f1c0c0;
}

.tabla-compras {
    width: 100%;
    border-collapse: collapse;
}

.tabla-compras th,
.tabla-compras td {
    border: 1px solid #e5e7eb;
    padding: 10px;
    text-align: center;
}

.tabla-compras th {
    background: #f9fafb;
    color: #374151;
}

.tabla-compras td.nombre-col {
    text-align: left;
}

.mensaje {
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-weight: 600;
}

.mensaje-error {
    background: #fef3f2;
    color: #b42318;
    border: 1px solid #fecdca;
}

.mensaje-ok {
    background: #ecfdf3;
    color: #027a48;
    border: 1px solid #abefc6;
}

.oculto {
    display: none;
}
</style>

<div class="compras-layout">

    <!-- IZQUIERDA -->
    <section>
        <div id="mensaje" class="mensaje oculto"></div>

        <div class="card">
            <h2>Nueva Compra</h2>

            <label class="campo-label">Buscar producto</label>
            <input type="text" id="buscarProducto" class="campo" placeholder="Buscar producto...">

            <label class="campo-label">Producto</label>
            <select id="producto" class="campo"></select>

            <label class="campo-label">Cantidad</label>
            <input type="number" id="cantidad" class="campo" min="1" value="1">

            <label class="campo-label">Costo unitario</label>
            <input type="number" id="precio_unitario" class="campo" min="0" step="0.01" value="0">

            <label class="campo-label">Fecha vencimiento</label>
            <input type="date" id="fecha_vencimiento" class="campo">

            <br><br>

            <button id="btnAgregar" class="btn btn-secundario">➕ Agregar</button>
        </div>

        <div class="card">
            <h3>Detalle de compra</h3>

            <table class="tabla-compras" id="tablaCompra">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Costo</th>
                        <th>Vencimiento</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <!-- DERECHA -->
    <aside>
        <div class="card">
            <h3>Datos de la compra</h3>

            <label class="campo-label">Proveedor</label>
            <select id="proveedor" class="campo"></select>

            <label class="campo-label">Número de factura</label>
            <input type="text" id="numero_factura" class="campo" placeholder="Ej. FAC-001">

            <hr>

            <h2>Total: Q <span id="totalCompra">0.00</span></h2>

            <button id="btnGuardarCompra" class="btn btn-primario" style="width:100%;" disabled>
                Guardar Compra
            </button>
        </div>
    </aside>

</div>

<script id="productos-data" type="application/json">
{{ productos_json | tojson }}
</script>

<script id="proveedores-data" type="application/json">
{{ proveedores_json | tojson }}
</script>

<script>
let productosData = []
let proveedoresData = []
let carritoCompra = []

function $(id) {
    return document.getElementById(id)
}

function mostrarMensaje(texto, tipo = "error") {
    const div = $("mensaje")
    div.className = "mensaje"
    div.classList.remove("oculto", "mensaje-error", "mensaje-ok")

    if (tipo === "ok") div.classList.add("mensaje-ok")
    else div.classList.add("mensaje-error")

    div.textContent = texto

    setTimeout(() => {
        div.classList.add("oculto")
    }, 3000)
}

function renderProductos(lista) {
    const select = $("producto")
    select.innerHTML = ""

    lista.forEach(p => {
        select.innerHTML += `
            <option value="${p.id}" data-costo="${p.precio_compra}">
                ${p.nombre}
            </option>
        `
    })

    if (lista.length > 0) {
        $("precio_unitario").value = parseFloat(lista[0].precio_compra).toFixed(2)
    }
}

function renderProveedores(lista) {
    const select = $("proveedor")
    select.innerHTML = ""

    lista.forEach(pr => {
        select.innerHTML += `
            <option value="${pr.id}">
                ${pr.nombre}
            </option>
        `
    })
}

function filtrarProductos() {
    const texto = $("buscarProducto").value.toLowerCase().trim()

    const filtrados = productosData.filter(p =>
        p.nombre.toLowerCase().includes(texto)
    )

    renderProductos(filtrados)
}

function actualizarPrecioDesdeProducto() {
    const selected = $("producto").selectedOptions[0]
    if (selected) {
        $("precio_unitario").value = parseFloat(selected.dataset.costo || "0").toFixed(2)
    }
}

function agregarProductoCompra() {
    const productoSelect = $("producto")
    const producto_id = parseInt(productoSelect.value || "0")
    const producto_nombre = productoSelect.selectedOptions[0]?.textContent || ""
    const cantidad = parseInt($("cantidad").value || "0")
    const precio_unitario = parseFloat($("precio_unitario").value || "0")
    const fecha_vencimiento = $("fecha_vencimiento").value

    if (!producto_id) {
        mostrarMensaje("Debes seleccionar un producto", "error")
        return
    }

    if (cantidad <= 0) {
        mostrarMensaje("La cantidad debe ser mayor a cero", "error")
        return
    }

    if (precio_unitario < 0) {
        mostrarMensaje("El costo unitario no puede ser negativo", "error")
        return
    }

    if (!fecha_vencimiento) {
        mostrarMensaje("Debes ingresar fecha de vencimiento", "error")
        return
    }

    carritoCompra.push({
        producto_id,
        producto_nombre,
        cantidad,
        precio_unitario,
        fecha_vencimiento,
        subtotal: cantidad * precio_unitario
    })

    renderTablaCompra()
    mostrarMensaje("Producto agregado a la compra", "ok")
}

function renderTablaCompra() {
    const tbody = document.querySelector("#tablaCompra tbody")
    tbody.innerHTML = ""

    let total = 0

    carritoCompra.forEach((item, index) => {
        total += item.subtotal

        tbody.innerHTML += `
            <tr>
                <td class="nombre-col">${item.producto_nombre}</td>
                <td>${item.cantidad}</td>
                <td>Q ${item.precio_unitario.toFixed(2)}</td>
                <td>${item.fecha_vencimiento}</td>
                <td>Q ${item.subtotal.toFixed(2)}</td>
                <td><button class="btn btn-danger" onclick="eliminarItemCompra(${index})">❌</button></td>
            </tr>
        `
    })

    $("totalCompra").textContent = total.toFixed(2)
    $("btnGuardarCompra").disabled = !(carritoCompra.length > 0 && $("numero_factura").value.trim())
}

function eliminarItemCompra(index) {
    carritoCompra.splice(index, 1)
    renderTablaCompra()
}

function guardarCompra() {
    const proveedor_id = $("proveedor").value
    const numero_factura = $("numero_factura").value.trim()

    if (!proveedor_id) {
        mostrarMensaje("Debes seleccionar un proveedor", "error")
        return
    }

    if (!numero_factura) {
        mostrarMensaje("Debes ingresar número de factura", "error")
        return
    }

    if (carritoCompra.length === 0) {
        mostrarMensaje("Debes agregar al menos un producto", "error")
        return
    }

    const btn = $("btnGuardarCompra")
    btn.disabled = true
    btn.textContent = "Guardando..."

    fetch("/api/compra", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            proveedor_id: proveedor_id,
            numero_factura: numero_factura,
            items: carritoCompra
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            mostrarMensaje(data.error, "error")
            btn.disabled = false
            btn.textContent = "Guardar Compra"
            return
        }

        mostrarMensaje("Compra guardada correctamente", "ok")
        setTimeout(() => location.reload(), 1200)
    })
}

document.addEventListener("DOMContentLoaded", () => {
    productosData = JSON.parse($("productos-data").textContent)
    proveedoresData = JSON.parse($("proveedores-data").textContent)

    renderProductos(productosData)
    renderProveedores(proveedoresData)

    $("buscarProducto").addEventListener("keyup", filtrarProductos)
    $("producto").addEventListener("change", actualizarPrecioDesdeProducto)
    $("btnAgregar").addEventListener("click", agregarProductoCompra)
    $("btnGuardarCompra").addEventListener("click", guardarCompra)
    $("numero_factura").addEventListener("input", renderTablaCompra)

    renderTablaCompra()
})
</script>

{% endblock %}
