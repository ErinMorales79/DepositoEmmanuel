{% extends "base.html" %}

{% block title %}Productos{% endblock %}

{% block content %}

<style>
.productos-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    align-items: start;
}

.card {
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.card h2,
.card h3 {
    margin-bottom: 14px;
    color: #1f2937;
}

.campo-label {
    display: block;
    margin: 10px 0 6px;
    font-weight: 600;
    color: #374151;
}

.campo {
    width: 100%;
    padding: 10px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
}

.check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0;
    font-weight: 600;
    color: #374151;
}

.check-row input {
    width: 16px;
    height: 16px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.btn {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s ease;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-primario {
    background: #0ea5a8;
    color: white;
}

.btn-secundario {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
}

.btn-danger {
    background: white;
    color: #b42318;
    border: 1px solid #f1c0c0;
}

.btn-editar {
    background: white;
    color: #0c63e7;
    border: 1px solid #bcd7ff;
}

.tabla-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.tabla-productos {
    width: 100%;
    border-collapse: collapse;
}

.tabla-productos th,
.tabla-productos td {
    border: 1px solid #e5e7eb;
    padding: 10px;
    text-align: center;
}

.tabla-productos th {
    background: #f9fafb;
    color: #374151;
}

.tabla-productos td.nombre-col {
    text-align: left;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
}

.badge-activo {
    background: #d1fadf;
    color: #05603a;
}

.badge-inactivo {
    background: #fde2e1;
    color: #b42318;
}

.mensaje {
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-weight: 600;
}

.mensaje-error {
    background: #fef3f2;
    color: #b42318;
    border: 1px solid #fecdca;
}

.mensaje-ok {
    background: #ecfdf3;
    color: #027a48;
    border: 1px solid #abefc6;
}

.oculto {
    display: none;
}

.resumen-productos {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.resumen-badge {
    background: #f3f4f6;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 13px;
    color: #374151;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

@media (max-width: 1000px) {
    .productos-layout {
        grid-template-columns: 1fr;
    }
}
</style>

<div class="productos-layout">

    <!-- IZQUIERDA -->
    <section>
        <div id="mensaje" class="mensaje oculto"></div>

        <div class="card">
            <div class="tabla-header">
                <h2>Productos</h2>
                <input
                    type="text"
                    id="buscarProducto"
                    class="campo"
                    placeholder="Buscar producto..."
                    style="max-width:300px;"
                >
            </div>

            <table class="tabla-productos" id="tablaProductos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Compra</th>
                        <th>Venta</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="resumen-productos">
                <span class="resumen-badge">Total: <strong id="resumenTotal">0</strong></span>
                <span class="resumen-badge">Activos: <strong id="resumenActivos">0</strong></span>
                <span class="resumen-badge">Inactivos: <strong id="resumenInactivos">0</strong></span>
            </div>
        </div>
    </section>

    <!-- DERECHA -->
    <aside>
        <div class="card">
            <h3 id="tituloFormulario">Nuevo producto</h3>

            <label class="campo-label">Nombre</label>
            <input type="text" id="nombre" class="campo" placeholder="Nombre del producto">

            <label class="campo-label">Código de barra</label>
            <input type="text" id="codigo_barra" class="campo" placeholder="8 a 14 dígitos" inputmode="numeric">

            <label class="campo-label">Marca</label>
            <select id="marca_id" class="campo"></select>

            <label class="campo-label">Proveedor</label>
            <select id="proveedor_id" class="campo"></select>

            <div class="grid-2">
                <div>
                    <label class="campo-label">Unidades por fardo</label>
                    <input type="number" id="unidades_por_fardo" class="campo" min="1" value="1">
                </div>
                <div>
                    <label class="campo-label">Stock mínimo</label>
                    <input type="number" id="stock_minimo" class="campo" min="0" value="0">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label class="campo-label">Precio compra</label>
                    <input type="number" id="precio_compra" class="campo" step="0.01" min="0" placeholder="0.00">
                </div>
                <div>
                    <label class="campo-label">Precio venta</label>
                    <input type="number" id="precio_venta" class="campo" step="0.01" min="0" placeholder="0.00">
                </div>
            </div>

            <label class="check-row">
                <input type="checkbox" id="requiere_vencimiento" checked>
                Requiere fecha de vencimiento
            </label>

            <label class="check-row">
                <input type="checkbox" id="es_retornable">
                Envase retornable
            </label>

            <div class="form-actions">
                <button id="btnGuardarProducto" class="btn btn-primario" style="flex:1;">
                    Guardar
                </button>
                <button id="btnNuevoProducto" class="btn btn-secundario" style="flex:1;">
                    Nuevo
                </button>
            </div>
        </div>
    </aside>

</div>

<script id="productos-data" type="application/json">
{{ productos_json | tojson }}
</script>

<script id="marcas-data" type="application/json">
{{ marcas_json | tojson }}
</script>

<script id="proveedores-data" type="application/json">
{{ proveedores_json | tojson }}
</script>

<script>
let productosData = []
let marcasData = []
let proveedoresData = []
let productoEditandoId = null

function $(id) {
    return document.getElementById(id)
}

function mostrarMensaje(texto, tipo = "error") {
    const div = $("mensaje")
    div.className = "mensaje"
    div.classList.remove("oculto", "mensaje-error", "mensaje-ok")

    if (tipo === "ok") div.classList.add("mensaje-ok")
    else div.classList.add("mensaje-error")

    div.textContent = texto

    setTimeout(() => {
        div.classList.add("oculto")
    }, 3500)
}

function llenarSelect(select, lista) {
    select.innerHTML = ""
    lista.forEach(x => {
        const opt = document.createElement("option")
        opt.value = x.id
        opt.textContent = x.nombre
        select.appendChild(opt)
    })
}

function limpiarFormulario() {
    productoEditandoId = null
    $("tituloFormulario").textContent = "Nuevo producto"
    $("nombre").value = ""
    $("codigo_barra").value = ""
    $("unidades_por_fardo").value = "1"
    $("stock_minimo").value = "0"
    $("precio_compra").value = ""
    $("precio_venta").value = ""
    $("requiere_vencimiento").checked = true
    $("es_retornable").checked = false
    if (marcasData.length) $("marca_id").value = marcasData[0].id
    if (proveedoresData.length) $("proveedor_id").value = proveedoresData[0].id
}

function actualizarResumen(lista) {
    $("resumenTotal").textContent = lista.length
    $("resumenActivos").textContent = lista.filter(p => p.activo).length
    $("resumenInactivos").textContent = lista.filter(p => !p.activo).length
}

function renderTabla(lista) {
    const tbody = document.querySelector("#tablaProductos tbody")
    tbody.innerHTML = ""

    lista.forEach(p => {
        const tr = document.createElement("tr")
        tr.innerHTML = `
            <td>${p.id}</td>
            <td>${p.codigo_barra}</td>
            <td class="nombre-col">${p.nombre}</td>
            <td>Q ${Number(p.precio_compra).toFixed(2)}</td>
            <td>Q ${Number(p.precio_venta).toFixed(2)}</td>
            <td>
                <span class="badge ${p.activo ? 'badge-activo' : 'badge-inactivo'}">
                    ${p.activo ? "Activo" : "Inactivo"}
                </span>
            </td>
            <td>
                <button class="btn btn-editar" data-editar="${p.id}">Editar</button>
                <button class="btn btn-danger" data-toggle="${p.id}">
                    ${p.activo ? "Desactivar" : "Activar"}
                </button>
            </td>
        `
        tbody.appendChild(tr)
    })

    actualizarResumen(lista)
}

function editarProducto(id) {
    const p = productosData.find(x => x.id === id)
    if (!p) return

    productoEditandoId = id
    $("tituloFormulario").textContent = `Editar producto #${id}`
    $("nombre").value = p.nombre
    $("codigo_barra").value = p.codigo_barra
    $("marca_id").value = p.marca_id
    $("proveedor_id").value = p.proveedor_id
    $("unidades_por_fardo").value = p.unidades_por_fardo
    $("stock_minimo").value = p.stock_minimo
    $("precio_compra").value = p.precio_compra
    $("precio_venta").value = p.precio_venta
    $("requiere_vencimiento").checked = !!p.requiere_vencimiento
    $("es_retornable").checked = !!p.es_retornable
}

function guardarProducto() {
    const payload = {
        nombre: $("nombre").value.trim(),
        codigo_barra: $("codigo_barra").value.trim(),
        marca_id: parseInt($("marca_id").value || "0"),
        proveedor_id: parseInt($("proveedor_id").value || "0"),
        unidades_por_fardo: parseInt($("unidades_por_fardo").value || "0"),
        stock_minimo: parseInt($("stock_minimo").value || "0"),
        precio_compra: parseFloat($("precio_compra").value || "0"),
        precio_venta: parseFloat($("precio_venta").value || "0"),
        requiere_vencimiento: $("requiere_vencimiento").checked,
        es_retornable: $("es_retornable").checked
    }

    if (!payload.nombre) {
        mostrarMensaje("El nombre es obligatorio", "error")
        return
    }

    if (!/^[0-9]{8,14}$/.test(payload.codigo_barra)) {
        mostrarMensaje("El código de barra debe tener entre 8 y 14 dígitos", "error")
        return
    }

    const url = productoEditandoId
        ? `/api/productos/${productoEditandoId}`
        : `/api/productos`

    const method = productoEditandoId ? "PUT" : "POST"

    fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            mostrarMensaje(data.error, "error")
            return
        }

        mostrarMensaje(productoEditandoId ? "Producto actualizado correctamente" : "Producto creado correctamente", "ok")
        setTimeout(() => location.reload(), 900)
    })
    .catch(() => mostrarMensaje("Error de red al guardar el producto", "error"))
}

function toggleEstado(id) {
    fetch(`/api/productos/${id}/estado`, { method: "PATCH" })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            mostrarMensaje(data.error, "error")
            return
        }

        mostrarMensaje("Estado del producto actualizado", "ok")
        setTimeout(() => location.reload(), 700)
    })
}

function filtrarTabla() {
    const texto = $("buscarProducto").value.toLowerCase().trim()

    const filtrados = productosData.filter(p =>
        p.nombre.toLowerCase().includes(texto) ||
        String(p.codigo_barra).includes(texto)
    )

    renderTabla(filtrados)
}

document.addEventListener("DOMContentLoaded", () => {
    productosData = JSON.parse($("productos-data").textContent)
    marcasData = JSON.parse($("marcas-data").textContent)
    proveedoresData = JSON.parse($("proveedores-data").textContent)

    llenarSelect($("marca_id"), marcasData)
    llenarSelect($("proveedor_id"), proveedoresData)

    renderTabla(productosData)
    limpiarFormulario()

    $("buscarProducto").addEventListener("keyup", filtrarTabla)
    $("btnGuardarProducto").addEventListener("click", guardarProducto)
    $("btnNuevoProducto").addEventListener("click", limpiarFormulario)

    document.querySelector("#tablaProductos tbody").addEventListener("click", (e) => {
        const editar = e.target.getAttribute("data-editar")
        const toggle = e.target.getAttribute("data-toggle")
        if (editar) editarProducto(parseInt(editar))
        if (toggle) toggleEstado(parseInt(toggle))
    })
})
</script>

{% endblock %}
