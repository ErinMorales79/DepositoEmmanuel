{% extends "base.html" %}

{% block title %}Nueva Venta{% endblock %}

{% block content %}

<style>
.ventas-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    align-items: start;
}

.card {
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
}

.card h2,
.card h3 {
    margin-bottom: 14px;
}

.campo-label {
    display: block;
    margin: 10px 0 6px;
    font-weight: 600;
    color: #333;
}

.campo {
    width: 100%;
    padding: 10px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
}

.campo-textarea {
    min-height: 90px;
    resize: vertical;
}

.stock-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.stock-label {
    font-weight: 600;
    color: #333;
}

.stock-badge {
    display: inline-block;
    min-width: 56px;
    text-align: center;
    padding: 6px 10px;
    border-radius: 999px;
    background: #eef6ff;
    color: #0c63e7;
    font-weight: 700;
}

.stock-badge.stock-cero {
    background: #fde2e1;
    color: #b42318;
}

.stock-badge.stock-bajo {
    background: #fff3cd;
    color: #7a4d00;
}

.stock-badge.stock-ok {
    background: #d1fadf;
    color: #05603a;
}

.acciones-venta {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.btn {
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s ease;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-primario {
    width: 100%;
    background: #0ea5a8;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
}

.btn-secundario {
    flex: 1;
    background: #f2f4f7;
    color: #344054;
    border: 1px solid #d0d5dd;
}

.btn-outline {
    flex: 1;
    background: #fff;
    color: #344054;
    border: 1px solid #d0d5dd;
}

.tabla-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.contador-items {
    color: #667085;
    font-size: 13px;
}

.tabla-carrito {
    width: 100%;
    border-collapse: collapse;
}

.tabla-carrito th,
.tabla-carrito td {
    border: 1px solid #e4e7ec;
    padding: 10px;
    text-align: center;
    vertical-align: middle;
}

.tabla-carrito th {
    background: #f9fafb;
}

.celda-producto {
    text-align: left;
}

.qty-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-mini {
    width: 28px;
    height: 28px;
    border: 1px solid #d0d5dd;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
}

.btn-eliminar {
    color: #b42318;
    background: #fff;
    border: 1px solid #f1c0c0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
}

.resumen-card {
    position: sticky;
    top: 12px;
}

.resumen-linea {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
    color: #344054;
}

.resumen-total {
    text-align: center;
    margin-bottom: 18px;
}

.resumen-total h1 {
    color: #0ea5a8;
    margin-top: 6px;
}

.mensaje {
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-weight: 600;
}

.mensaje-error {
    background: #fef3f2;
    color: #b42318;
    border: 1px solid #fecdca;
}

.mensaje-ok {
    background: #ecfdf3;
    color: #027a48;
    border: 1px solid #abefc6;
}

.mensaje-info {
    background: #eff8ff;
    color: #175cd3;
    border: 1px solid #b2ddff;
}

.oculto {
    display: none;
}

@media (max-width: 1000px) {
    .ventas-layout {
        grid-template-columns: 1fr;
    }

    .resumen-card {
        position: static;
    }
}
</style>

<div class="ventas-layout">

    <!-- IZQUIERDA -->
    <div class="ventas-main">
        <div id="mensaje" class="mensaje oculto"></div>

        <div class="card">
            <h2>Venta</h2>

            <label class="campo-label">Buscar producto</label>
            <input type="text" id="buscar" class="campo" placeholder="Escribe nombre del producto...">

            <label class="campo-label">Producto</label>
            <select id="producto" class="campo"></select>

            <div class="stock-wrap">
                <span class="stock-label">Stock disponible</span>
                <span id="stock" class="stock-badge">0</span>
            </div>

            <label class="campo-label">Cantidad</label>
            <input type="number" id="cantidad" class="campo" min="1" value="1">

            <div class="acciones-venta">
                <button id="btnAgregar" class="btn btn-secundario">➕ Agregar</button>
                <button id="btnLimpiar" class="btn btn-outline">Limpiar</button>
            </div>
        </div>

        <div class="card">
            <div class="tabla-header">
                <h3>Carrito</h3>
                <span id="contadorItems" class="contador-items">0 items</span>
            </div>

            <table id="tabla" class="tabla-carrito">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- DERECHA -->
    <aside class="ventas-side">
        <div class="card">
            <h3>Detalle de venta</h3>

            <label class="campo-label">Buscar cliente</label>
            <input type="text" id="buscarCliente" class="campo" placeholder="Escribe nombre del cliente...">

            <label class="campo-label">Cliente</label>
            <select id="cliente" class="campo"></select>

            <label class="campo-label">Dirección</label>
            <input type="text" id="direccion" class="campo" placeholder="Dirección del cliente">

            <label class="campo-label">Tipo de pago</label>
            <select id="tipo_pago" class="campo">
                <option value="EFECTIVO">💵 Efectivo</option>
                <option value="TARJETA">💳 Tarjeta</option>
            </select>

            <label class="campo-label">Observaciones</label>
            <textarea id="observaciones" class="campo campo-textarea" placeholder="Observaciones de la venta"></textarea>
        </div>

        <div class="card resumen-card">
            <div class="resumen-linea">
                <span>Items</span>
                <strong id="resumenItems">0</strong>
            </div>

            <div class="resumen-total">
                <span>Total</span>
                <h1>Q <span id="total">0.00</span></h1>
            </div>

            <button id="btnGuardar" class="btn btn-primario" disabled onclick="guardarVenta()">
                Guardar Venta
            </button>
        </div>
    </aside>

</div>

<script id="productos-data" type="application/json">
{{ productos_json | tojson }}
</script>

<script id="clientes-data" type="application/json">
{{ clientes_json | tojson }}
</script>

<script>
//estado
let carrito = [];
let total = 0;
let productosBase = [];
let clientesBase = [];
let stockPorProducto = {};

//helpers
function $(id) {
    return document.getElementById(id);
}

function obtenerJSON(idScript) {
    const script = $(idScript);
    if (!script) return [];
    try {
        return JSON.parse(script.textContent);
    } catch {
        return [];
    }
}

function mostrarMensaje(texto, tipo = "error") {
    const box = $("mensaje");
    if (!box) return;

    box.className = "mensaje";
    box.classList.remove("oculto", "mensaje-error", "mensaje-ok", "mensaje-info");

    if (tipo === "ok") box.classList.add("mensaje-ok");
    else if (tipo === "info") box.classList.add("mensaje-info");
    else box.classList.add("mensaje-error");

    box.textContent = texto;

    clearTimeout(window.__mensajeTimer);
    window.__mensajeTimer = setTimeout(() => {
        box.classList.add("oculto");
    }, 2800);
}

function actualizarEstadoBotonGuardar() {
    const btn = $("btnGuardar");
    const cliente = $("cliente")?.value;

    if (!btn) return;

    if (!cliente || carrito.length === 0) {
        btn.disabled = true;
    } else {
        btn.disabled = false;
    }
}

function actualizarStockBadge(stock) {
    const badge = $("stock");
    if (!badge) return;

    badge.textContent = stock;

    badge.classList.remove("stock-cero", "stock-bajo", "stock-ok");

    if (stock <= 0) {
        badge.classList.add("stock-cero");
    } else if (stock <= 5) {
        badge.classList.add("stock-bajo");
    } else {
        badge.classList.add("stock-ok");
    }
}

// selects
function renderProductosSelect(lista) {
    const select = $("producto");
    if (!select) return;

    select.innerHTML = "";

    lista.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.nombre} - Q${Number(p.precio_venta).toFixed(2)}`;
        select.appendChild(opt);
    });
}

function renderClientesSelect(lista) {
    const select = $("cliente");
    if (!select) return;

    const seleccionadoActual = select.value;
    select.innerHTML = "";

    lista.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.nombre;
        select.appendChild(opt);
    });

    if (lista.some(c => String(c.id) === String(seleccionadoActual))) {
        select.value = seleccionadoActual;
    }

    actualizarEstadoBotonGuardar();
}

// productos
function filtrarProductos() {
    const filtro = $("buscar").value.toLowerCase().trim();

    const filtrados = productosBase.filter(p =>
        p.nombre.toLowerCase().includes(filtro)
    );

    renderProductosSelect(filtrados);

    if (filtrados.length > 0) {
        mostrarStock();
    } else {
        actualizarStockBadge(0);
    }
}

function mostrarStock() {
    const productoId = $("producto")?.value;

    if (!productoId) {
        actualizarStockBadge(0);
        return;
    }

    fetch(`/api/stock/${productoId}`)
        .then(r => r.json())
        .then(data => {
            const stock = Number(data.stock ?? 0);
            stockPorProducto[productoId] = stock;
            actualizarStockBadge(stock);
        })
        .catch(() => {
            stockPorProducto[productoId] = 0;
            actualizarStockBadge(0);
            mostrarMensaje("No se pudo consultar el stock", "error");
        });
}

// clientes
function filtrarClientes() {
    const filtro = $("buscarCliente").value.toLowerCase().trim();

    const filtrados = clientesBase.filter(c =>
        c.nombre.toLowerCase().includes(filtro)
    );

    renderClientesSelect(filtrados);
}

function autocompletarDireccionCliente() {
    const clienteId = $("cliente")?.value;
    const cliente = clientesBase.find(c => String(c.id) === String(clienteId));

    if (cliente && $("direccion") && !$("direccion").dataset.editado) {
        $("direccion").value = cliente.direccion || "";
    }

    actualizarEstadoBotonGuardar();
}

// carrito
function agregarProducto() {
    const productoId = parseInt($("producto")?.value || "0");
    const cantidad = parseInt($("cantidad")?.value || "0");
    const stock = Number($("stock")?.textContent || "0");

    if (!productoId) {
        mostrarMensaje("Debes seleccionar un producto", "error");
        return;
    }

    const producto = productosBase.find(p => p.id === productoId);
    if (!producto) {
        mostrarMensaje("Producto inválido", "error");
        return;
    }

    if (cantidad <= 0) {
        mostrarMensaje("La cantidad debe ser mayor a cero", "error");
        return;
    }

    if (stock === 0 || cantidad > stock) {
        mostrarMensaje("No hay stock suficiente", "error");
        return;
    }

    const existente = carrito.find(i => i.producto_id === productoId);

    if (existente) {
        const nuevaCantidad = existente.cantidad + cantidad;
        if (nuevaCantidad > stock) {
            mostrarMensaje("Supera el stock disponible", "error");
            return;
        }

        existente.cantidad = nuevaCantidad;
        existente.subtotal = existente.cantidad * existente.precio;
    } else {
        carrito.push({
            producto_id: producto.id,
            nombre: producto.nombre,
            precio: Number(producto.precio_venta),
            cantidad,
            subtotal: cantidad * Number(producto.precio_venta)
        });
    }

    renderCarrito();
    mostrarMensaje("Producto agregado al carrito", "ok");
}

function renderCarrito() {
    const tbody = document.querySelector("#tabla tbody");
    const contador = $("contadorItems");

    if (!tbody) return;

    tbody.innerHTML = "";

    carrito.forEach((item, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="celda-producto">${item.nombre}</td>
            <td>
                <div class="qty-controls">
                    <button class="btn-mini" onclick="cambiarCantidad(${index}, -1)">-</button>
                    <span>${item.cantidad}</span>
                    <button class="btn-mini" onclick="cambiarCantidad(${index}, 1)">+</button>
                </div>
            </td>
            <td>Q ${item.precio.toFixed(2)}</td>
            <td>Q ${item.subtotal.toFixed(2)}</td>
            <td><button class="btn-eliminar" onclick="eliminarProducto(${index})">❌</button></td>
        `;

        tbody.appendChild(tr);
    });

    total = carrito.reduce((acc, item) => acc + item.subtotal, 0);
    $("total").textContent = total.toFixed(2);
    $("resumenItems").textContent = carrito.length;

    if (contador) {
        contador.textContent = `${carrito.length} item${carrito.length === 1 ? "" : "s"}`;
    }

    actualizarEstadoBotonGuardar();
}

function cambiarCantidad(index, cambio) {
    const item = carrito[index];
    if (!item) return;

    if (cambio > 0) {
        const stockActual = stockPorProducto[item.producto_id] ?? 0;
        if (item.cantidad + 1 > stockActual) {
            mostrarMensaje("No hay suficiente stock para aumentar", "error");
            return;
        }
    }

    item.cantidad += cambio;

    if (item.cantidad <= 0) {
        carrito.splice(index, 1);
    } else {
        item.subtotal = item.cantidad * item.precio;
    }

    renderCarrito();
}

function eliminarProducto(index) {
    carrito.splice(index, 1);
    renderCarrito();
    mostrarMensaje("Producto eliminado del carrito", "info");
}

// guradar
function guardarVenta() {
    const cliente_id = $("cliente")?.value;
    const direccion = $("direccion")?.value || "";
    const tipo_pago = $("tipo_pago")?.value || "EFECTIVO";
    const observaciones = $("observaciones")?.value || "";

    if (!cliente_id) {
        mostrarMensaje("Debes seleccionar un cliente", "error");
        return;
    }

    if (carrito.length === 0) {
        mostrarMensaje("Debes agregar al menos un producto", "error");
        return;
    }

    const btn = $("btnGuardar");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    fetch("/api/venta", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            cliente_id,
            direccion,
            tipo_pago,
            observaciones,
            items: carrito.map(i => ({
                producto_id: i.producto_id,
                cantidad: i.cantidad,
                subtotal: i.subtotal
            }))
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            mostrarMensaje(data.error, "error");
            btn.disabled = false;
            btn.textContent = "Guardar Venta";
            actualizarEstadoBotonGuardar();
            return;
        }

        mostrarMensaje("Venta guardada correctamente", "ok");

        setTimeout(() => {
            location.reload();
        }, 1200);
    })
    .catch(() => {
        mostrarMensaje("Ocurrió un error al guardar la venta", "error");
        btn.disabled = false;
        btn.textContent = "Guardar Venta";
        actualizarEstadoBotonGuardar();
    });
}

// eventos
document.addEventListener("DOMContentLoaded", () => {
    productosBase = JSON.parse($("productos-data").textContent);
    clientesBase = JSON.parse($("clientes-data").textContent);

    renderProductosSelect(productosBase);
    renderClientesSelect(clientesBase);

    $("buscar").addEventListener("keyup", filtrarProductos);
    $("buscarCliente").addEventListener("keyup", filtrarClientes);
    $("producto").addEventListener("change", mostrarStock);
    $("cliente").addEventListener("change", autocompletarDireccionCliente);
    $("cantidad").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            agregarProducto();
        }
    });

    $("btnAgregar").addEventListener("click", agregarProducto);
    $("btnLimpiar").addEventListener("click", () => {
        $("buscar").value = "";
        renderProductosSelect(productosBase);
        mostrarStock();
        $("cantidad").value = 1;
        mostrarMensaje("Búsqueda limpiada", "info");
    });

    $("direccion").addEventListener("input", () => {
        $("direccion").dataset.editado = "true";
    });

    mostrarStock();
    autocompletarDireccionCliente();
    actualizarEstadoBotonGuardar();
});
</script>

{% endblock %}
