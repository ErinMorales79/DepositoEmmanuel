{% extends "base.html" %}

{% block title %}Stock{% endblock %}

{% block content %}

<style>
.stock-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.card {
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 18px;
}

.card h2,
.card h3 {
    margin-bottom: 14px;
    color: #1f2937;
}

.campo {
    width: 100%;
    max-width: 350px;
    padding: 10px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
}

.tabla-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
    flex-wrap: wrap;
}

.tabla-stock {
    width: 100%;
    border-collapse: collapse;
}

.tabla-stock th,
.tabla-stock td {
    border: 1px solid #e5e7eb;
    padding: 10px;
    text-align: center;
}

.tabla-stock th {
    background: #f9fafb;
    color: #374151;
}

.tabla-stock td.nombre-col {
    text-align: left;
}

.badge-stock {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
}

.badge-cero {
    background: #fde2e1;
    color: #b42318;
}

.badge-bajo {
    background: #fff3cd;
    color: #7a4d00;
}

.badge-ok {
    background: #d1fadf;
    color: #05603a;
}

.resumen-stock {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.resumen-badge {
    background: #f3f4f6;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 13px;
    color: #374151;
}
</style>

<div class="stock-layout">

    <!-- RESUMEN STOCK -->
    <section class="card">
        <div class="tabla-header">
            <h2>Stock en Bodega</h2>
            <input
                type="text"
                id="buscarStock"
                class="campo"
                placeholder="Buscar producto..."
            >
        </div>

        <table class="tabla-stock" id="tablaResumen">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="resumen-stock">
            <span class="resumen-badge">Productos con stock: <strong id="resumenConStock">0</strong></span>
            <span class="resumen-badge">Productos sin stock: <strong id="resumenSinStock">0</strong></span>
            <span class="resumen-badge">Total productos: <strong id="resumenTotal">0</strong></span>
        </div>
    </section>

    <!-- DETALLE LOTES-->
    <section class="card">
        <div class="tabla-header">
            <h3>Detalle por Lote</h3>
            <input
                type="text"
                id="buscarLote"
                class="campo"
                placeholder="Buscar por producto o lote..."
            >
        </div>

        <table class="tabla-stock" id="tablaLotes">
            <thead>
                <tr>
                    <th>Lote</th>
                    <th>Producto</th>
                    <th>Vencimiento</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

</div>

<script id="stock-resumen-data" type="application/json">
{{ stock_resumen_json | tojson }}
</script>

<script id="lotes-data" type="application/json">
{{ lotes_json | tojson }}
</script>

<script>
let stockResumenData = []
let lotesData = []

function $(id) {
    return document.getElementById(id)
}

function badgeStock(valor) {
    if (valor <= 0) {
        return `<span class="badge-stock badge-cero">Sin stock</span>`
    }
    if (valor <= 5) {
        return `<span class="badge-stock badge-bajo">${valor}</span>`
    }
    return `<span class="badge-stock badge-ok">${valor}</span>`
}

function renderResumen(lista) {
    const tbody = document.querySelector("#tablaResumen tbody")
    tbody.innerHTML = ""

    lista.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.producto_id}</td>
                <td class="nombre-col">${item.producto}</td>
                <td>${badgeStock(item.stock)}</td>
            </tr>
        `
    })

    $("resumenConStock").textContent = lista.filter(x => x.stock > 0).length
    $("resumenSinStock").textContent = lista.filter(x => x.stock <= 0).length
    $("resumenTotal").textContent = lista.length
}

function renderLotes(lista) {
    const tbody = document.querySelector("#tablaLotes tbody")
    tbody.innerHTML = ""

    lista.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.lote_id}</td>
                <td class="nombre-col">${item.producto}</td>
                <td>${item.fecha_vencimiento || "-"}</td>
                <td>${item.cantidad}</td>
            </tr>
        `
    })
}

function filtrarResumen() {
    const texto = $("buscarStock").value.toLowerCase().trim()

    const filtrados = stockResumenData.filter(item =>
        item.producto.toLowerCase().includes(texto)
    )

    renderResumen(filtrados)
}

function filtrarLotes() {
    const texto = $("buscarLote").value.toLowerCase().trim()

    const filtrados = lotesData.filter(item =>
        item.producto.toLowerCase().includes(texto) ||
        String(item.lote_id).includes(texto)
    )

    renderLotes(filtrados)
}

document.addEventListener("DOMContentLoaded", () => {
    stockResumenData = JSON.parse($("stock-resumen-data").textContent)
    lotesData = JSON.parse($("lotes-data").textContent)

    renderResumen(stockResumenData)
    renderLotes(lotesData)

    $("buscarStock").addEventListener("keyup", filtrarResumen)
    $("buscarLote").addEventListener("keyup", filtrarLotes)
})
</script>

{% endblock %}
